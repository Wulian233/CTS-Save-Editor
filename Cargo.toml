[workspace]
members = ["crates/save-core", "src-tauri"]
default-members = ["crates/save-core"]
resolver = "3"

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
